name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          c++ --version
          make --version

      - name: Install RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-unknown-elf

      - name: Build simulator
        run: make

      - name: Run C++ tests
        run: make test

      - name: Run assembly memory tests
        run: make asm-test
