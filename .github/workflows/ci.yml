name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-regression:
    name: Build, Test, And Regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          c++ --version
          make --version

      - name: Build simulator
        run: make

      - name: Run C++ tests
        run: make test

      - name: Run golden-output regressions
        run: make regression
